<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PWA sportive pour commencer petit et construire une habitude durable.">
  <meta name="theme-color" content="#17191B">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Petit départ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Petit départ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Petit départ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Do not reload on first installation: this page already has fresh files.
      const wasControlled = Boolean(navigator.serviceWorker.controller);
      let reloading = false;
      let updatePending = false;
      const activeSessionKey = 'petit_depart_active_session_v1';
      const sessionIsActive = function () {
        return window.localStorage.getItem(activeSessionKey) !== null;
      };

      const showDeferredUpdate = function () {
        if (updatePending) return;
        updatePending = true;
        const banner = document.createElement('div');
        banner.setAttribute('role', 'status');
        banner.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;background:#303438;color:#F3F0E7;padding:16px;border:1px solid #F4CC46;border-radius:12px;font:16px sans-serif;box-shadow:0 4px 16px #0008';
        const message = document.createElement('span');
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Actualiser maintenant';
        button.style.cssText = 'display:block;margin-top:10px;padding:10px 14px;background:#F4CC46;color:#17191B;border:0;border-radius:8px;font-weight:bold';
        button.addEventListener('click', function () {
          if (!sessionIsActive()) {
            reloading = true;
            window.location.reload();
          }
        });
        banner.append(message, button);
        document.body.appendChild(banner);
        const updateBanner = function () {
          const active = sessionIsActive();
          message.textContent = active
            ? 'Mise à jour prête. Terminez la séance avant d’actualiser.'
            : 'Mise à jour prête. Vous pouvez actualiser.';
          button.disabled = active;
        };
        updateBanner();
        window.setInterval(updateBanner, 1000);
      };

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (wasControlled && !reloading) {
          if (sessionIsActive()) {
            showDeferredUpdate();
          } else {
            reloading = true;
            window.location.reload();
          }
        }
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('pwa_service_worker.js', {
          scope: './',
          updateViaCache: 'none'
        })
          .then(function (registration) {
            // Browsers check on navigation; also check tabs left open for days.
            const checkForUpdates = function () {
              if (!document.hidden && navigator.onLine) {
                registration.update().catch(function (error) {
                  console.warn('Vérification de mise à jour indisponible', error);
                });
              }
            };
            document.addEventListener('visibilitychange', checkForUpdates);
            window.addEventListener('online', checkForUpdates);
            window.setInterval(checkForUpdates, 5 * 60 * 1000);
          })
          .catch(function (error) { console.warn('Cache hors connexion indisponible', error); });
      });
    }
  </script>
</body>
</html>
